# 物流售前现场调研工具 · 静态服务（纯 http，前面用 Lucky 反代成 HTTPS 域名）
# 用法：在本目录执行  docker compose up -d
# 更新工具：替换 ../tools/index.html 后  docker compose restart  （或客户端刷新即可）

services:
  survey:
    image: nginx:alpine
    container_name: logistics-survey
    restart: unless-stopped
    ports:
      - "8087:80"        # 宿主端口:容器端口；Lucky 反代指向 http://<NAS局域网IP>:8087
    volumes:
      - ../tools:/usr/share/nginx/html:ro              # 工具文件（只读挂载，改了无需重建镜像）
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro # 站点配置
