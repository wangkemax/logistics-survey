server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # PWA manifest 需要正确 MIME（nginx 默认 mime.types 不含 .webmanifest）
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Service Worker 与入口页不缓存，保证改动能及时更新到客户端
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
